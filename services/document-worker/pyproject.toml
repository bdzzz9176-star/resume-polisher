[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-search-document-worker"
version = "0.0.0"
description = "Document parsing and export service for AI Job Search"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "pydantic",
  "python-docx",
  "PyMuPDF",
  "python-multipart",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
  "httpx",
  "pytest",
  "ruff",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

